spring:
  application:
    name: practical-training-backend
  sql:
    init:
      mode: never
  datasource:
    driver-class-name: "${DB_DRIVER:org.postgresql.Driver}"
    url: "${DB_URL:jdbc:postgresql://219.216.65.31:54321/course_platform}"
    username: "${DB_USERNAME:system}"
    password: "${DB_PASSWORD:P@ssw0rd}"
    hikari:
      maximum-pool-size: 20
      minimum-idle: 3
      idle-timeout: 600000
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 3001
  servlet:
    context-path: /practical-training

course-resource:
  office-preview:
    enabled: ${COURSE_RESOURCE_OFFICE_PREVIEW_ENABLED:false}
    soffice-path: ${COURSE_RESOURCE_SOFFICE_PATH:C:/Program Files/LibreOffice/program/soffice.exe}
    timeout-seconds: 60

# Agentic AI 服务配置
agentic:
  mode: ${AGENTIC_MODE:mock}
  base-url: ${AGENTIC_BASE_URL:http://localhost:8081}
  api-key: ${AGENTIC_API_KEY:}
  model: ${AGENTIC_MODEL:gpt-4o-mini}
logging:
  level:
    "[com.neu.CoursePlatform.mapper]": debug
    "[com.neu.CoursePlatform.controller]": debug

mybatis-plus:
  type-aliases-package: com.neu.CoursePlatform.entity
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
