spring:
  application:
    name: practical-training-backend
  sql:
    init:
      mode: always
      continue-on-error: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://localhost:3306/practical_training?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    hikari:
      maximum-pool-size: 20
      minimum-idle: 3
      idle-timeout: 600000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /practical-training

course-resource:
  office-preview:
    enabled: ${COURSE_RESOURCE_OFFICE_PREVIEW_ENABLED:false}
    soffice-path: ${COURSE_RESOURCE_SOFFICE_PATH:C:/Program Files/LibreOffice/program/soffice.exe}
    timeout-seconds: 60

agentic:
  mode: ${AGENTIC_MODE:mock}
  base-url: ${AGENTIC_BASE_URL:}

logging:
  level:
    "[com.neu.CoursePlatform.mapper]": debug
    "[com.neu.CoursePlatform.controller]": debug

mybatis-plus:
  type-aliases-package: com.neu.CoursePlatform.entity
  mapper-locations: classpath*:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

agentic:
  api-key: ${AGENTIC_API_KEY:}
  base-url: ${AGENTIC_BASE_URL:https://api.openai.com/v1/chat/completions}
  model: ${AGENTIC_MODEL:gpt-4o-mini}
