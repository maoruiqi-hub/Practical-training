spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:60}
      minimum-idle: ${DB_POOL_MIN_IDLE:15}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:10000}

server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:300}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:30}
    accept-count: ${TOMCAT_ACCEPT_COUNT:500}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:10s}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024

logging:
  level:
    "[com.neu.CoursePlatform.mapper]": warn
    "[com.neu.CoursePlatform.controller]": info

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

agentic:
  mode: ${AGENTIC_MODE:deepseek}
