spring:
  datasource:
    driver-class-name: com.kingbase8.Driver
    url: "${DB_URL:jdbc:kingbase8://localhost:54321/practical_training}"
    username: "${DB_USERNAME:SYSTEM}"
    password: "${DB_PASSWORD:123456}"
    hikari:
      maximum-pool-size: 20
      minimum-idle: 3
      idle-timeout: 600000
      connection-test-query: SELECT 1
  sql:
    init:
      mode: "${DB_INIT_MODE:never}"
      schema-locations: optional:classpath:schema-kingbase.sql
      data-locations: optional:classpath:data-kingbase.sql
      encoding: UTF-8
  h2:
    console:
      enabled: false

mybatis-plus:
  type-aliases-package: com.neu.CoursePlatform.entity,com.neu.CoursePlatform.profile.entity,com.neu.CoursePlatform.module5_analytics.entity
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: "NULL"
